[package]
name = "xloka-flow"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
description = "High-performance Analytics DB and API Server using DuckDB and MySQL CDC"
authors = ["xloka"]
repository = "https://github.com/Xloka/xloka-flow"
license = "MIT"
categories = ["command-line-utilities", "database"]
keywords = ["duckdb", "mysql", "cdc", "replication", "analytics"]
readme = "README.md"
default-run = "xloka-flow"
exclude = [
    ".github/",
    ".dockerignore",
    ".gitattributes",
    "dist-workspace.toml",
    "postman/",
]

[package.metadata.docs.rs]
no-default-features = true
all-features = false
default-target = "x86_64-unknown-linux-gnu"
targets = []

[features]
default = ["bundled"]
bundled = ["duckdb/bundled"]

[[bin]]
name = "xloka-flow"
path = "src/main.rs"

[dependencies]
# Web & Async runtime
axum = { version = "0.8", features = ["ws", "macros", "json"] }
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", features = ["sink"] }
futures = "0.3"

# Analytical Engine (bundled by default; disabled on docs.rs so doc builds do not compile C++)
duckdb = { version = "1", default-features = false }

# MySQL async driver with first-party binlog replication support
mysql_async = { version = "0.37", features = ["binlog"] }
mysql_common = "0.37"

# SQL parsing (SELECT-only guard and DDL AST translation)
sqlparser = "0.62"

# Data structures & serialization
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
# csv pinned to 1.3 for stable MSRV and standard CRLF stream serialization
csv = "1.3"

# HTTP & Middleware
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "fs"] }
tower = "0.5"

# Logging & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
config = "0.14"
dotenvy = "0.15"
async-trait = "0.1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", features = ["json", "stream"] }

[profile.dist]
inherits = "release"
lto = "thin"
